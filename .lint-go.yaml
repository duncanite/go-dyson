# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out. `just do lint go` renders the two on every run
# (book/linting-go.md, "one baseline, per-project carve-outs"). Seeded once;
# the file is the project's own. Every key the overlay accepts is below, with
# what it does; anything else is refused as baseline policy.
#
# golangci:
#   linters:
#     disable:                       # takes a linter out of the baseline's set
#       - zerologlint
#     enable:                        # adds one the baseline turns off
#       - godox
#     exclusions:
#       paths:                       # appends: files golangci-lint skips entirely
#         - third_party/
#       presets:                     # appends golangci-lint's exclusion presets
#         - comments
#       rules:                       # appends: linters, or a finding text, off under a path.
#         # The baseline exempts tests from gocognit, goconst, gosec,
#         # varnamelen and wrapcheck; anything else a project tolerates there
#         # is its own. The reviewed shape, to tailor: tests are black-box
#         # consumers, so the rules about API hygiene and production
#         # robustness do not apply to them, while the rules about correctness
#         # do (errcheck stays on: a test that ignores an error can pass for
#         # the wrong reason).
#         - path: _test\.go
#           linters:
#             - dupl # test cases are meant to look alike
#             - dupword # test data
#             - err113 # dynamic errors are fine in fixtures
#             - dogsled # multiple-return helpers are exercised for one value at a time
#             - noctx # no cancellation to propagate
#             - perfsprint # readability over allocations
#             - mnd # fixture values
#     settings:                      # per linter, merged key by key into the baseline's:
#       wrapcheck:                   #   a scalar overrides, a mapping recurses, a list appends,
#         ignore-package-globs:      #   a named entry (a revive rule) overrides its namesake
#           - github.com/example/project/*
#   formatters:
#     enable:                        # adds a formatter (the baseline runs gci, gofumpt, golines, goimports)
#       - swaggo
#     exclusions:
#       paths:                       # appends: files the formatters skip
#         - internal/generated/
#     settings:                      # per formatter, merged like the linters'
#       golines:
#         max-len: 100
#       gci:
#         sections:                  # go in before the module's own group: a sibling
#           - prefix(github.com/example-sibling)  # organization's imports group next to this one's
# licenses:
#   allowed:                         # replaces the baseline's list of accepted dependency licenses
#     - Apache-2.0
#     - MIT
#   ignore:                          # appends modules go-licenses skips (its known false positives)
#     - gotest.tools/v3
# nilaway:
#   blocking: false                  # findings print without failing the lane, while a backlog is worked off
#   exclude-pkgs:                    # appends package prefixes NilAway leaves out
#     - github.com/example/project/internal/generated
#   exclude-errors-in-files:         # appends file prefixes: NilAway has no per-line suppression
#     - internal/legacy/
# commands:
#   unshipped:                       # the main packages under cmd/ no release ships (book/releasing.md):
#     - ./cmd/gen                    #   built and run from the tree; one command per entry, read by
#                                    #   limen's workflows rule, nothing for golangci-lint

golangci:
  linters:
    settings:
      depguard:
        rules:
          main:
            # What the module is built on: the house application toolkit,
            # the CLI framework and the mDNS library for the command, and
            # the library that carries MQTT's bytes; the rules below keep
            # each of the last two to its place.
            allow:
              - github.com/mycophonic/primordium
              - github.com/alecthomas/kong
              - github.com/forkcloser/go-mdns
              - github.com/eclipse/paho.mqtt.golang
          search:
            # mDNS is the command's: its port is one to a host and belongs
            # to the program. The library says what a purifier is on the
            # network, and is lent the means to look.
            files:
              - "!**/internal/cli/*.go"
            deny:
              - pkg: github.com/forkcloser/go-mdns
                desc: the library opens no socket to search; it is lent a Browser
          carrier:
            # Paho is named by package mqtt and its test broker and by
            # nothing else: every other package speaks MQTT through
            # mqtt's own API, and none of Paho's types cross it.
            files:
              - "!**/mqtt/*.go"
              - "!**/mqtt/mqtttest/*.go"
            deny:
              - pkg: github.com/eclipse/paho.mqtt.golang
                desc: speak MQTT through this module's mqtt package
      tagliatelle:
        # Every JSON tag in this module is a key of a purifier's messages,
        # which writes its keys with dashes.
        case:
          rules:
            json: kebab
      wrapcheck:
        # The module's own packages wrap every error with its context at
        # the call that failed; a caller re-wrapping each one would say
        # the same thing twice.
        ignore-package-globs:
          - github.com/duncanite/go-dyson/*

licenses:
  # Eclipse Paho is offered under the EPL-2.0 or the EDL-1.0, at the
  # taker's choice (its LICENSE: "made available under the terms of the
  # Eclipse Public License v2.0 and Eclipse Distribution License v1.0").
  # The EDL-1.0 is the BSD-3-Clause's text, which the baseline accepts,
  # and it is the one this module takes Paho under; go-licenses reads the
  # file as EPL-2.0 alone. Accepted by the repository's owner, 2026-11-15.
  ignore:
    - github.com/eclipse/paho.mqtt.golang

commands:
  unshipped:
    # Built and run from the tree until it has been run against a
    # purifier; no release ships it yet.
    - ./cmd/dyson
